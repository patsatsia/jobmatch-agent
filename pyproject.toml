[project]
name = "jobmatch-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle: basic style errors and warnings
    "F", # pyflakes: unused imports, undefined names, real bugs
    "I", # isort: import sorting
    "B", # bugbear: likely bugs (mutable default args, etc.)
    "UP", # pyupgrade: use modern syntax for your Python version
    "SIM", # simplify: needlessly complex code
    "C4", # comprehensions: cleaner list/dict/set comprehensions
    "ASYNC", # async pitfalls (blocking calls inside async def)
    "S", # bandit: security issues (hardcoded secrets, SQL injection)
    "PT", # pytest style
    "RUF", # Ruff's own rules
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"migrations/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
files = ["app", "tests"]
exclude = ["migrations/"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false        # don't force type hints on every test function


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: needs the Docker database",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
